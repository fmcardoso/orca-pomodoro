<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <!-- A · Dueto (docs/design/v2/dueto.html) with the Costelão pet (docs/design/v4-costelao). -->
    <main id="app" class="dueto" data-state="idle" aria-label="Pomodoro">
      <div class="widget">
        <section class="hero">
          <div id="portrait" class="portrait">
            <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="track" cx="50" cy="50" r="46" />
              <circle id="arc" class="arc" cx="50" cy="50" r="46" pathLength="100" transform="rotate(-90 50 50)" />
            </svg>
            <svg id="pet" class="pixel-pet" role="img" aria-label="Sleeping tomato" width="64" height="64" viewBox="0 0 32 32"></svg>
          </div>
          <div class="readout">
            <span id="status" class="status" role="status">Ready</span>
            <div id="clock" class="clock" role="timer" aria-label="Time left">25:00</div>
            <div class="actions">
              <button id="primary" class="primary" type="button" aria-label="Start" title="Start">
                <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m8 5 10 7-10 7Z" fill="currentColor" stroke-linejoin="round" />
                </svg>
                <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 5.5v13m8-13v13" stroke-width="3.7" />
                </svg>
                <span id="primary-label">Start</span>
              </button>
              <button id="reset" class="reset" type="button" title="Reset timer" aria-label="Reset timer">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 10a8 8 0 1 1 1.4 7.2M4 4.5V10h5.5" />
                </svg>
              </button>
            </div>
          </div>
        </section>
        <section class="settings" aria-label="Session length">
          <span class="row-label">Duration</span>
          <div class="choices" role="group" aria-label="Shortcuts in minutes">
            <button type="button" data-preset="25" aria-label="25 minutes">25</button><button type="button" data-preset="50" aria-label="50 minutes">50</button>
          </div>
          <label class="custom">
            <input id="minutes" aria-label="Custom minutes" title="Custom minutes" type="number" min="1" max="180" step="1" value="25" inputmode="numeric" />
            min
          </label>
        </section>
        <section id="breaks" class="settings breaks" aria-label="Break" hidden>
          <span class="row-label">Break</span>
          <div class="choices" role="group" aria-label="Break length in minutes">
            <button type="button" data-break="5" aria-label="5 minutes">5</button><button type="button" data-break="15" aria-label="15 minutes">15</button>
          </div>
          <span class="unit">min</span>
          <button id="skip-break" class="skip" type="button" title="Skip the break and start another pomodoro">Skip</button>
        </section>
        <footer>
          <span id="today" class="today">Today: 0 🍅</span>
          <span class="count-steps" role="group" aria-label="Correct today's count">
            <button id="count-minus" class="step" type="button" title="One pomodoro less today" aria-label="Remove one pomodoro from today">−</button>
            <button id="count-plus" class="step" type="button" title="One pomodoro more today" aria-label="Add one pomodoro to today">+</button>
          </span>
          <button id="reset-day" class="clear" type="button">Reset day</button>
        </footer>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script type="module" src="./panel-main.ts"></script>
  </body>
</html>
