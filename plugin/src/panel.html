<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main id="app" class="pet is-idle face-sleeping" data-status="idle">
      <section class="stage" aria-label="Tomate de estimação">
        <svg class="pet-svg" viewBox="0 0 240 240" role="img" aria-labelledby="pet-title">
          <title id="pet-title">Tomate Pomodoro</title>
          <defs>
            <radialGradient id="g-body" cx="38%" cy="32%" r="78%">
              <stop offset="0%" stop-color="#ff9a85" />
              <stop offset="38%" stop-color="#f4533f" />
              <stop offset="82%" stop-color="#d93526" />
              <stop offset="100%" stop-color="#b8261b" />
            </radialGradient>
            <linearGradient id="g-leaf" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6fd47a" />
              <stop offset="100%" stop-color="#2f9e47" />
            </linearGradient>
            <linearGradient id="g-ring-run" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff8a6b" />
              <stop offset="100%" stop-color="#e5372a" />
            </linearGradient>
            <linearGradient id="g-ring-done" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7be08a" />
              <stop offset="100%" stop-color="#2f9e47" />
            </linearGradient>
          </defs>

          <!-- Progress ring: time left. -->
          <circle class="ring-track" cx="120" cy="120" r="108" />
          <circle class="ring-progress" cx="120" cy="120" r="108" pathLength="1000" />

          <!-- Celebration bits, shown when a pomodoro finishes. -->
          <g class="confetti" aria-hidden="true">
            <rect class="c c1" x="52" y="62" width="7" height="12" rx="2" />
            <rect class="c c2" x="178" y="58" width="7" height="12" rx="2" />
            <circle class="c c3" cx="44" cy="120" r="4.5" />
            <circle class="c c4" cx="196" cy="118" r="4.5" />
            <rect class="c c5" x="70" y="34" width="6" height="10" rx="2" />
            <rect class="c c6" x="162" y="32" width="6" height="10" rx="2" />
            <path class="c c7 spark" d="M36 82l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
            <path class="c c8 spark" d="M204 80l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
          </g>

          <!-- Sleep bubbles, shown while paused or idle. -->
          <g class="zzz" aria-hidden="true">
            <text class="z z1" x="170" y="80">z</text>
            <text class="z z2" x="184" y="62">z</text>
            <text class="z z3" x="198" y="42">Z</text>
          </g>

          <ellipse class="shadow" cx="120" cy="196" rx="58" ry="7" />

          <g class="tomato">
            <g class="body-wrap">
              <!-- Body with soft lobes. -->
              <path
                class="body"
                d="M120 70c-22 0-30 6-44 10-24 8-34 30-34 52 0 34 34 60 78 60s78-26 78-60c0-22-10-44-34-52-14-4-22-10-44-10z"
                fill="url(#g-body)"
              />
              <path class="ridge" d="M96 82c-14 18-18 56-6 96" />
              <path class="ridge" d="M144 82c14 18 18 56 6 96" />
              <ellipse class="shine" cx="84" cy="104" rx="16" ry="9" transform="rotate(-32 84 104)" />
              <ellipse class="shine shine-sm" cx="104" cy="90" rx="5" ry="3" transform="rotate(-20 104 90)" />

              <!-- Calyx and stem. -->
              <g class="calyx" transform="translate(120 79) scale(1 .62)">
                <path d="M0 0C9-8 25-9 38-2C25 3 11 5 0 0Z" transform="rotate(18)" />
                <path d="M0 0C9-8 25-9 38-2C25 3 11 5 0 0Z" transform="rotate(-38)" />
                <path d="M0 0C9-8 25-9 38-2C25 3 11 5 0 0Z" transform="rotate(-142) scale(1 -1)" />
                <path d="M0 0C9-8 25-9 38-2C25 3 11 5 0 0Z" transform="rotate(162) scale(1 -1)" />
                <path d="M0 0C9-8 25-9 38-2C25 3 11 5 0 0Z" transform="rotate(92)" />
                <circle r="6" />
              </g>
              <path class="stem" d="M121 70c0-8 2-14 7-19" />

              <!-- Cheeks. -->
              <ellipse class="cheek" cx="80" cy="148" rx="11" ry="6.5" />
              <ellipse class="cheek" cx="160" cy="148" rx="11" ry="6.5" />

              <!-- Focused face. -->
              <g class="face face-focused">
                <path class="brow" d="M89 118l16 3" />
                <path class="brow" d="M151 118l-16 3" />
                <g class="eyes-open">
                  <ellipse class="eye" cx="99" cy="134" rx="6.5" ry="8.5" />
                  <ellipse class="eye" cx="141" cy="134" rx="6.5" ry="8.5" />
                  <circle class="glint" cx="101.5" cy="130.5" r="2.4" />
                  <circle class="glint" cx="143.5" cy="130.5" r="2.4" />
                </g>
                <path class="mouth-line" d="M110 158c6 4 14 4 20 0" />
              </g>

              <!-- Sleeping face. -->
              <g class="face face-sleeping">
                <path class="lid" d="M90 136c5 6 13 6 18 0" />
                <path class="lid" d="M132 136c5 6 13 6 18 0" />
                <ellipse class="mouth-o" cx="120" cy="160" rx="5" ry="6" />
              </g>

              <!-- Happy face. -->
              <g class="face face-happy">
                <path class="lid" d="M89 138l10-10 10 10" />
                <path class="lid" d="M131 138l10-10 10 10" />
                <path class="mouth-open" d="M102 152h36c0 14-8 22-18 22s-18-8-18-22z" />
                <path class="tongue" d="M111 167c5-5 13-5 18 0-3 5-6 7-9 7s-6-2-9-7z" />
              </g>
            </g>
          </g>
        </svg>
      </section>

      <section class="readout">
        <div id="clock" class="clock" role="timer" aria-live="off">25:00</div>
        <div id="caption" class="caption" aria-live="polite">Zzz… pronto para focar?</div>
      </section>

      <section class="controls">
        <button id="primary" class="btn btn-primary" type="button">Iniciar</button>
        <button id="reset" class="btn btn-secondary" type="button">Resetar timer</button>
      </section>

      <section class="minutes">
        <label for="minutes" class="minutes-label">Minutos</label>
        <input id="minutes" class="minutes-input" type="number" min="1" max="180" step="1" value="25" inputmode="numeric" />
        <div class="presets" role="group" aria-label="Atalhos de duração">
          <button class="chip" type="button" data-minutes="25">25</button>
          <button class="chip" type="button" data-minutes="50">50</button>
        </div>
      </section>

      <section class="today">
        <div class="today-text">
          <span id="today" class="today-label">Hoje: 0 🍅</span>
          <span id="dots" class="dots" aria-hidden="true"></span>
        </div>
        <button id="reset-day" class="btn btn-ghost" type="button">Zerar dia</button>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script type="module" src="./panel-main.ts"></script>
  </body>
</html>
